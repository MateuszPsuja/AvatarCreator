<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" style="--skin-base: #4A2912;--skin-ear: #3C200E;--skin-shadow: #291505;--lip-color: #5C2E18;--hair-color: #1A1A2E;--eye-color: #6B3A2A"><defs><clipPath id="face-clip"><path d="M51,86 A49,55 0 0 1 149,86 L149,192 L51,192 Z"/></clipPath><clipPath id="hat-clip"><rect x="0" y="56" width="200" height="144"/></clipPath><clipPath id="helmet-clip"><ellipse cx="100" cy="78" rx="57" ry="62"/></clipPath></defs><g class="layer-body">
      <!-- Navy uniform -->
      <path d="M30,200 Q30,158 55,150 Q75,143 88,140
              L88,145 Q90,148 100,148 Q110,148 112,145 L112,140
              Q125,143 145,150 Q170,158 170,200 Z" fill="#1E3A8A"/>
      <!-- Collar -->
      <path d="M86,140 L82,148 L92,152 L100,148 L108,152 L118,148 L114,140"
            fill="#1E40AF" stroke="#1E3A8A" stroke-width="0.8"/>
      <!-- Shoulder epaulettes -->
      <rect x="52" y="148" width="18" height="5" rx="2" fill="#1E40AF" stroke="#2563EB" stroke-width="0.8"/>
      <rect x="130" y="148" width="18" height="5" rx="2" fill="#1E40AF" stroke="#2563EB" stroke-width="0.8"/>
      <!-- Badge (left breast) -->
      <g transform="translate(82,168)">
        <polygon points="0,-6 1.5,-2 5.5,-2 2.5,0.5 3.5,4.5 0,2 -3.5,4.5 -2.5,0.5 -5.5,-2 -1.5,-2"
                 fill="#EAB308" stroke="#CA8A04" stroke-width="0.5"/>
      </g>
      <!-- Buttons down front -->
      <circle cx="100" cy="175" r="1.5" fill="#D4D4D8"/>
      <circle cx="100" cy="185" r="1.5" fill="#D4D4D8"/>
      <circle cx="100" cy="195" r="1.5" fill="#D4D4D8"/>
      <!-- Breast pockets -->
      <path d="M76,162 L76,172 L88,172" fill="none" stroke="#1E40AF" stroke-width="1"/>
      <path d="M124,162 L124,172 L112,172" fill="none" stroke="#1E40AF" stroke-width="1"/></g><rect class="layer-neck" x="90" y="135" width="20" height="22" rx="8" fill="var(--skin-base)"/><g class="layer-head"><g class="layer-ears"><ellipse cx="48" cy="90" rx="7" ry="9" fill="var(--skin-ear)"/><ellipse cx="152" cy="90" rx="7" ry="9" fill="var(--skin-ear)"/></g><g class="layer-hair-back" clip-path="url(#hat-clip)">
      <circle cx="100" cy="24" r="18" fill="var(--hair-color)"/>
      <ellipse cx="100" cy="60" rx="54" ry="32" fill="var(--hair-color)"/></g><ellipse class="layer-face" cx="100" cy="86" rx="49" ry="55" fill="var(--skin-base)"/><g class="layer-eyes"><g>
      <circle cx="74" cy="88" r="11" fill="#FFF"/>
      <circle cx="126" cy="88" r="11" fill="#FFF"/></g><g class="pupils"><g>
      <circle cx="74" cy="88" r="9" fill="var(--eye-color)"/>
      <circle cx="74" cy="88" r="5" fill="#1A1A2E"/>
      <circle cx="77" cy="85" r="2" fill="#FFF"/>
      <circle cx="126" cy="88" r="9" fill="var(--eye-color)"/>
      <circle cx="126" cy="88" r="5" fill="#1A1A2E"/>
      <circle cx="129" cy="85" r="2" fill="#FFF"/></g></g></g><g class="layer-lashes"><path d="M65,78 L62,74" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M70,76 L68,72" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M76,76 L78,72" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M82,78 L85,74" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M117,78 L114,74" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M122,76 L120,72" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M128,76 L130,72" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M134,78 L137,74" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/></g><g class="layer-brows"><path d="M64,74 Q74,69 84,73" stroke="var(--hair-color)" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M116,73 Q126,69 136,74" stroke="var(--hair-color)" stroke-width="2" fill="none" stroke-linecap="round"/></g><path class="layer-nose" d="M98,104 Q100,110 102,104" stroke="var(--skin-shadow)" stroke-width="1.8" fill="none" stroke-linecap="round"/><path class="layer-mouth" d="M84,120 Q100,132 116,120" stroke="var(--lip-color)" stroke-width="2.5" fill="var(--lip-color)" fill-opacity="0.35" stroke-linecap="round"></path><g class="layer-mustache"><g clip-path="url(#face-clip)"></g></g><g class="layer-beard"><g clip-path="url(#face-clip)"></g></g><g class="layer-glasses"></g><g class="layer-hair-front" clip-path="url(#hat-clip)">
      <path d="M48,75 Q48,32 100,28 Q152,32 152,75 Q140,56 100,52 Q60,56 48,75 Z"
            fill="var(--hair-color)"/></g><g class="layer-accessory">
      <!-- Hair cover -->
      <ellipse cx="100" cy="54" rx="56" ry="20" fill="#1E3A8A"/>
      <!-- Police cap — crown -->
      <path d="M50,54 L50,40 Q50,20 100,16 Q150,20 150,40 L150,54 Z" fill="#1E3A8A"/>
      <!-- Cap band -->
      <rect x="50" y="46" width="100" height="8" rx="0" fill="#1E40AF"/>
      <!-- Cap badge -->
      <g transform="translate(100,44)">
        <polygon points="0,-6 2,-2 6,-2 3,1 4,5 0,3 -4,5 -3,1 -6,-2 -2,-2"
                 fill="#EAB308"/>
      </g>
      <!-- Cap brim (visor) -->
      <path d="M46,54 Q46,62 100,66 Q154,62 154,54 Z" fill="#111827"/></g></g></svg>
