# Publishes the avatar packages to npm when a GitHub release is published.
#
# Two packages, each self-contained: the avatar geometry is compiled into both,
# so neither depends on the other and there is no ordering requirement.
#
#   angular-avatar-player   ng-packagr, partial Ivy, peers on Angular 19
#   react-avatar-player     components + hooks, peers on React 18/19
#
# The published version comes from each package's own package.json, and the
# release tag must match both — they share one geometry, so releasing them at
# different versions would ship divergent renderers under the same avatar name.
name: Publish avatar packages to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Check the tag matches both package versions
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          NG=$(node -p "require('./src/libs/avatar-player/package.json').version")
          REACT=$(node -p "require('./src/libs/avatar-player-react/package.json').version")
          if [ "$TAG" != "$NG" ] || [ "$TAG" != "$REACT" ]; then
            echo "Tag $TAG does not match angular=$NG react=$REACT" >&2
            exit 1
          fi

      - name: Build both packages
        run: npm run build:libs

      - name: Publish angular-avatar-player
        run: npm publish dist/avatar-player --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish react-avatar-player
        run: npm publish dist/avatar-player-react --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}