      <line x1="78" y1="16" x2="78" y2="8" stroke="#78909C" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="78" cy="5" r="3" fill="#EF4444" stroke="#DC2626" stroke-width="0.8"/></g></g></svg>
