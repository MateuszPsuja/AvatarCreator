      <circle cx="74" cy="88" r="11" fill="#FFF"/>
      <circle cx="126" cy="88" r="11" fill="#FFF"/></g><g class="pupils"><g>
      <circle cx="74" cy="88" r="9" fill="var(--eye-color)"/>
      <circle cx="74" cy="88" r="5" fill="#1A1A2E"/>
      <circle cx="77" cy="85" r="2" fill="#FFF"/>
      <circle cx="126" cy="88" r="9" fill="var(--eye-color)"/>
      <circle cx="126" cy="88" r="5" fill="#1A1A2E"/>
      <circle cx="129" cy="85" r="2" fill="#FFF"/></g></g></g><g class="layer-brows"><rect x="63" y="72" width="22" height="5" rx="3" fill="var(--hair-color)"/><rect x="115" y="72" width="22" height="5" rx="3" fill="var(--hair-color)"/></g><path class="layer-nose" d="M97,105 Q100,112 103,105" stroke="var(--skin-shadow)" stroke-width="2" fill="none" stroke-linecap="round"/><path class="layer-mouth" d="M84,120 Q100,132 116,120" stroke="var(--lip-color)" stroke-width="2.5" fill="none" stroke-linecap="round"></path><g class="layer-mustache" clip-path="url(#helmet-clip)"><g clip-path="url(#face-clip)"></g></g><g class="layer-beard" clip-path="url(#helmet-clip)"><g clip-path="url(#face-clip)"><path d="M55.26,97.52 Q55.99,99.29 56.38,100.17 Q56.78,101.05 57.2,101.94 Q57.62,102.82 58.07,103.7 Q58.53,104.58 59.01,105.47 Q59.49,106.35 60,107.23 Q60.51,108.12 61.05,109 Q61.6,109.88 62.17,110.77 Q62.75,111.65 63.36,112.53 Q63.97,113.42 64.62,114.3 Q65.27,115.18 65.95,116.06 Q66.64,116.95 67.37,117.83 Q68.1,118.71 68.87,119.6 Q69.64,120.48 70.46,121.36 Q71.28,122.25 72.15,123.13 Q73.02,124.01 73.95,124.9 Q74.88,125.78 75.88,126.66 Q76.87,127.54 77.94,128.43 Q79.01,129.31 80.16,130.19 Q81.31,131.08 82.56,131.96 Q83.81,132.84 85.19,133.73 Q86.56,134.61 88.09,135.49 Q89.61,136.38 91.34,137.26 Q93.08,138.14 95.11,139.02 Q97.14,139.91 98.57,140.79 Q100,141.67 100,142.56 Q100,143.44 100,143.44 Q100,143.44 100,142.56 Q100,141.67 101.43,140.79 Q102.86,139.91 104.89,139.02 Q106.92,138.14 108.66,137.26 Q110.39,136.38 111.91,135.49 Q113.44,134.61 114.81,133.73 Q116.19,132.84 117.44,131.96 Q118.69,131.08 119.84,130.19 Q120.99,129.31 122.06,128.43 Q123.13,127.54 124.12,126.66 Q125.12,125.78 126.05,124.9 Q126.98,124.01 127.85,123.13 Q128.72,122.25 129.54,121.36 Q130.36,120.48 131.13,119.6 Q131.9,118.71 132.63,117.83 Q133.36,116.95 134.05,116.06 Q134.73,115.18 135.38,114.3 Q136.03,113.42 136.64,112.53 Q137.25,111.65 137.83,110.77 Q138.4,109.88 138.95,109 Q139.49,108.12 140,107.23 Q140.51,106.3