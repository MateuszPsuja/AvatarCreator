<!-- creator.page.html — risograph press room -->
<div class="studio grain reg-marks">

  <!-- ══ STAGE: the plate being printed ══ -->
  <main class="stage">
    <div class="stage-inner">
      <div class="stage-head">
        <span class="font-label text-muted-foreground">Press bed · 200 × 200</span>
        <a routerLink="/demo" class="font-label text-primary hover:underline">View exports →</a>
      </div>

      <div class="press" [class.press--speaking]="isSpeaking()">
        <app-svg-avatar
          [config]="config()"
          [animationsEnabled]="true"
          [viseme]="currentViseme()"
          class="press-art" />
      </div>

      <input
        type="text"
        class="name-plate"
        placeholder="Name this character"
        aria-label="Avatar name"
        [ngModel]="config().name"
        (ngModelChange)="updateName($event)"
        (blur)="commitName()"
        (keydown.enter)="commitName()" />

      <div class="stage-tools">
        <button hlmBtn variant="outline" size="sm" (click)="testSpeech()"
                [disabled]="isSpeaking()">
          {{ isSpeaking() ? 'Speaking' : 'Test speech' }}
        </button>
        <button hlmBtn variant="ghost" size="sm" (click)="randomize()">Randomize</button>
      </div>

      <!-- Screen-reader announcement for save / export / randomize -->
      <p class="sr-only" role="status" aria-live="polite">{{ status() ?? '' }}</p>
    </div>

    <div class="status-strip" [class.status-strip--on]="!!status()">
      @if (status()) { <span>{{ status() }}</span> }
    </div>
  </main>

  <!-- ══ RAIL: the control sheet ══ -->
  <aside class="rail">
    <header class="rail-head">
      <h1 class="rail-title font-display">Avatar<span class="rail-title-em">press</span></h1>
      <p class="font-label text-muted-foreground">Flat vector · spot colour</p>
    </header>

    <hlm-separator />

    <div hlmTabs="appearance" class="flex-1 min-h-0 flex flex-col">
      <div hlmTabsList class="w-full grid grid-cols-3">
        <button hlmTabsTrigger="appearance">Form</button>
        <button hlmTabsTrigger="style">Style</button>
        <button hlmTabsTrigger="profession">Trade</button>
      </div>

      <!-- FORM -->
      <div hlmTabsContent="appearance" class="flex flex-col gap-6 overflow-y-auto flex-1 pr-1">
        <section class="flex flex-col gap-2">
          <label hlmLabel>Gender</label>
          <app-trait-picker
            label="Gender" [options]="genderOptions"
            [value]="config().gender" (selected)="update('gender', $event)" />
        </section>

        <section class="flex flex-col gap-2">
          <label hlmLabel>Skin tone</label>
          <app-swatch-picker
            label="Skin tone" [swatches]="skinSwatches"
            [value]="config().skinTone" (selected)="update('skinTone', $event)" />
        </section>

        <section class="flex flex-col gap-2">
          <label hlmLabel>Hair style</label>
          <app-trait-picker
            label="Hair style" [options]="haircutOptions"
            [value]="config().haircut" (selected)="update('haircut', $event)" />
        </section>

        <section class="flex flex-col gap-2">
          <label hlmLabel>Hair colour</label>
          <app-swatch-picker
            label="Hair colour" [swatches]="hairSwatches"
            [value]="config().hairColor" (selected)="update('hairColor', $event)" />
        </section>

        <section class="flex flex-col gap-2">
          <label hlmLabel>Eye style</label>
          <app-trait-picker
            label="Eye style" [options]="eyeOptions"
            [value]="config().eyeStyle" (selected)="update('eyeStyle', $event)" />
        </section>

        <section class="flex flex-col gap-2">
          <label hlmLabel>Eye colour</label>
          <app-swatch-picker
            label="Eye colour" [swatches]="eyeSwatches"
            [value]="config().eyeColor" (selected)="update('eyeColor', $event)" />
        </section>
      </div>

      <!-- STYLE -->
      <div hlmTabsContent="style" class="flex flex-col gap-6 overflow-y-auto flex-1 pr-1">
        <section class="flex flex-col gap-2">
          <label hlmLabel>Moustache</label>
          <app-trait-picker
            label="Moustache" [options]="mustacheOptions"
            [value]="config().mustache" (selected)="update('mustache', $event)" />
        </section>

        <section class="flex flex-col gap-2">
          <label hlmLabel>Beard</label>
          <app-trait-picker
            label="Beard" [options]="beardOptions"
            [value]="config().beard" (selected)="update('beard', $event)" />
        </section>

        <section class="flex flex-col gap-2">
          <label hlmLabel>Glasses</label>
          <app-trait-picker
            label="Glasses" [options]="glassesOptions"
            [value]="config().glasses" (selected)="update('glasses', $event)" />
        </section>
      </div>

      <!-- TRADE -->
      <div hlmTabsContent="profession" class="flex flex-col gap-6 overflow-y-auto flex-1 pr-1">
        <section class="flex flex-col gap-2">
          <label hlmLabel>Profession</label>
          <app-trait-picker
            label="Profession" [options]="professionOptions"
            [value]="config().profession" (selected)="update('profession', $event)" />
        </section>
      </div>
    </div>

    <hlm-separator />

    <div class="rail-foot">
      <div class="flex gap-2">
        <button hlmBtn variant="outline" size="sm" (click)="undo()"
                [disabled]="!canUndo()" aria-label="Undo">↶</button>
        <button hlmBtn variant="outline" size="sm" (click)="redo()"
                [disabled]="!canRedo()" aria-label="Redo">↷</button>
        <button hlmBtn variant="ghost" size="sm" (click)="reset()">Reset</button>
      </div>
      <div class="flex gap-2">
        <button hlmBtn variant="outline" size="sm" (click)="export()">Export SVG</button>
        <button hlmBtn size="sm" (click)="save()">Save</button>
      </div>
    </div>
  </aside>
</div>
