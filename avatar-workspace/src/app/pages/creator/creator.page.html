<!-- creator.page.html — dark Spartan NG layout -->
<div class="creator-layout">

  <!-- LEFT: Controls Panel -->
  <aside class="flex flex-col gap-5 p-5 bg-card border-r border-border overflow-y-auto h-screen
                max-md:h-auto max-md:border-r-0 max-md:border-b max-md:border-border">

    <!-- Header -->
    <header>
      <h1 class="text-lg font-bold tracking-tight text-foreground">Avatar Creator</h1>
      <p class="text-xs text-muted-foreground mt-0.5">Design your character</p>
    </header>

    <hlm-separator />

    <!-- Spartan Tabs -->
    <div hlmTabs="appearance" class="flex-1 min-h-0 flex flex-col">

      <div hlmTabsList class="w-full grid grid-cols-3">
        <button hlmTabsTrigger="appearance">Appearance</button>
        <button hlmTabsTrigger="style">Style</button>
        <button hlmTabsTrigger="profession">Profession</button>
      </div>

      <!-- TAB: Appearance -->
      <div hlmTabsContent="appearance" class="flex flex-col gap-5 pt-1 overflow-y-auto flex-1">
        <section class="flex flex-col gap-2">
          <label hlmLabel>Gender</label>
          <app-trait-picker
            [options]="genderOptions"
            [value]="config().gender"
            (selected)="update('gender', $event)" />
        </section>

        <section class="flex flex-col gap-2">
          <label hlmLabel>Skin Tone</label>
          <app-swatch-picker
            [swatches]="skinSwatches"
            [value]="config().skinTone"
            (selected)="update('skinTone', $event)" />
        </section>

        <section class="flex flex-col gap-2">
          <label hlmLabel>Hair Style</label>
          <app-trait-picker
            [options]="haircutOptions"
            [value]="config().haircut"
            (selected)="update('haircut', $event)" />
        </section>

        <section class="flex flex-col gap-2">
          <label hlmLabel>Hair Color</label>
          <app-swatch-picker
            [swatches]="hairSwatches"
            [value]="config().hairColor"
            (selected)="update('hairColor', $event)" />
        </section>

        <section class="flex flex-col gap-2">
          <label hlmLabel>Eye Style</label>
          <app-trait-picker
            [options]="eyeOptions"
            [value]="config().eyeStyle"
            (selected)="update('eyeStyle', $event)" />
        </section>

        <section class="flex flex-col gap-2">
          <label hlmLabel>Eye Color</label>
          <app-swatch-picker
            [swatches]="eyeSwatches"
            [value]="config().eyeColor"
            (selected)="update('eyeColor', $event)" />
        </section>
      </div>

      <!-- TAB: Style -->
      <div hlmTabsContent="style" class="flex flex-col gap-5 pt-1 overflow-y-auto flex-1">
        <section class="flex flex-col gap-2">
          <label hlmLabel>Mustache</label>
          <app-trait-picker
            [options]="mustacheOptions"
            [value]="config().mustache"
            (selected)="update('mustache', $event)" />
        </section>

        <section class="flex flex-col gap-2">
          <label hlmLabel>Beard</label>
          <app-trait-picker
            [options]="beardOptions"
            [value]="config().beard"
            (selected)="update('beard', $event)" />
        </section>

        <section class="flex flex-col gap-2">
          <label hlmLabel>Glasses</label>
          <app-trait-picker
            [options]="glassesOptions"
            [value]="config().glasses"
            (selected)="update('glasses', $event)" />
        </section>
      </div>

      <!-- TAB: Profession -->
      <div hlmTabsContent="profession" class="flex flex-col gap-5 pt-1 overflow-y-auto flex-1">
        <section class="flex flex-col gap-2">
          <label hlmLabel>Profession</label>
          <app-trait-picker
            [options]="professionOptions"
            [value]="config().profession"
            (selected)="update('profession', $event)" />
        </section>
      </div>
    </div>

    <hlm-separator />

    <!-- Actions -->
    <div class="flex gap-2 justify-end">
      <button hlmBtn variant="ghost" size="sm" (click)="reset()">Reset</button>
      <button hlmBtn variant="outline" size="sm" (click)="export()">Export SVG</button>
      <button hlmBtn size="sm" (click)="save()">Save Avatar</button>
    </div>
  </aside>

  <!-- RIGHT: Live Preview -->
  <main class="creator-preview flex items-center justify-center p-8 relative overflow-hidden">
    <!-- Glow backdrop -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
      <div class="w-[420px] h-[420px] rounded-full bg-primary/8 blur-3xl"></div>
    </div>

    <div class="relative flex flex-col items-center gap-4"
         [class.avatar-speaking]="isSpeaking()">

      <app-svg-avatar
        [config]="config()"
        [animationsEnabled]="true"
        [viseme]="currentViseme()"
        class="preview-avatar w-[360px] h-[360px] rounded-2xl bg-card/60 backdrop-blur-sm
               border border-border/50 transition-all duration-300
               hover:scale-[1.02] hover:shadow-lg hover:shadow-primary/10" />

      <input
        type="text"
        class="bg-transparent border border-transparent rounded-lg px-3 py-1.5
               text-center text-base font-semibold text-foreground
               placeholder:text-muted-foreground
               hover:border-border focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary
               transition-all w-52"
        placeholder="My Avatar"
        [ngModel]="config().name"
        (ngModelChange)="updateName($event)" />

      <button hlmBtn variant="outline" size="sm" (click)="testSpeech()"
              [disabled]="isSpeaking()"
              class="mt-1">
        {{ isSpeaking() ? '🗣️ Speaking…' : '🎤 Test Speech' }}
      </button>
    </div>
  </main>

</div>
