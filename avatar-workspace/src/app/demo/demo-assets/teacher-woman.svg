<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" style="--skin-base: #F0AC78;--skin-ear: #E09A62;--skin-shadow: #C67C45;--lip-color: #C97050;--hair-color: #6B3A2A;--eye-color: #6B3A2A"><defs><clipPath id="hat-clip"><rect x="0" y="56" width="200" height="144"/></clipPath><clipPath id="helmet-clip"><ellipse cx="100" cy="78" rx="57" ry="62"/></clipPath></defs><g class="layer-body">
      <!-- Light blue dress shirt -->
      <path d="M30,200 Q30,158 55,150 Q75,143 88,140
              L88,145 Q90,148 100,148 Q110,148 112,145 L112,140
              Q125,143 145,150 Q170,158 170,200 Z" fill="#DBEAFE"/>
      <!-- Shirt collar -->
      <path d="M88,140 L82,148 L94,152" fill="#BFDBFE" stroke="#93C5FD" stroke-width="0.7"/>
      <path d="M112,140 L118,148 L106,152" fill="#BFDBFE" stroke="#93C5FD" stroke-width="0.7"/>
      <!-- Dark navy sweater vest -->
      <path d="M55,200 Q56,162 65,154 Q78,147 88,144
              L94,152 L100,148 L106,152 L112,144
              Q122,147 135,154 Q144,162 145,200 Z" fill="#1E293B"/>
      <!-- V-neck of sweater vest -->
      <path d="M88,144 L94,152 L100,148 L106,152 L112,144"
            fill="#DBEAFE" stroke="#1E293B" stroke-width="0.8"/>
      <!-- Sweater vest bottom ribbing -->
      <line x1="58" y1="196" x2="142" y2="196" stroke="#334155" stroke-width="1"/>
      <line x1="57" y1="198" x2="143" y2="198" stroke="#334155" stroke-width="0.5"/>
      <!-- Sleeves (shirt showing) -->
      <path d="M30,200 Q30,158 55,150 Q62,148 65,154
              L58,200 Z" fill="#DBEAFE"/>
      <path d="M170,200 Q170,158 145,150 Q138,148 135,154
              L142,200 Z" fill="#DBEAFE"/>
      <!-- Bow tie -->
      <path d="M93,147 L88,143 L88,151 Z" fill="#991B1B"/>
      <path d="M107,147 L112,143 L112,151 Z" fill="#991B1B"/>
      <circle cx="100" cy="147" r="2.5" fill="#B91C1C" stroke="#7F1D1D" stroke-width="0.5"/></g><rect class="layer-neck" x="90" y="135" width="20" height="22" rx="8" fill="var(--skin-base)"/><g class="layer-head"><g class="layer-ears"><ellipse cx="48" cy="90" rx="7" ry="9" fill="var(--skin-ear)"/><ellipse cx="152" cy="90" rx="7" ry="9" fill="var(--skin-ear)"/></g><g class="layer-hair-back">
      <ellipse cx="100" cy="62" rx="54" ry="34" fill="var(--hair-color)"/>
      <path d="M130,42 Q158,40 162,60 Q166,90 158,130 Q154,142 148,140
              Q152,120 150,80 Q148,50 130,42 Z"
            fill="var(--hair-color)"/></g><ellipse class="layer-face" cx="100" cy="86" rx="49" ry="55" fill="var(--skin-base)"/><g class="layer-eyes"><g>
      <ellipse cx="74" cy="88" rx="12" ry="9" fill="#FFF"/>
      <ellipse cx="126" cy="88" rx="12" ry="9" fill="#FFF"/></g><g class="pupils"><g>
      <circle cx="74" cy="88" r="8" fill="var(--eye-color)"/>
      <circle cx="74" cy="88" r="5" fill="#1A1A2E"/>
      <circle cx="77" cy="85" r="2" fill="#FFF"/>
      <circle cx="126" cy="88" r="8" fill="var(--eye-color)"/>
      <circle cx="126" cy="88" r="5" fill="#1A1A2E"/>
      <circle cx="129" cy="85" r="2" fill="#FFF"/></g></g></g><g class="layer-lashes"><path d="M65,78 L62,74" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M70,76 L68,72" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M76,76 L78,72" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M82,78 L85,74" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M117,78 L114,74" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M122,76 L120,72" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M128,76 L130,72" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M134,78 L137,74" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/></g><g class="layer-brows"><path d="M64,74 Q74,69 84,73" stroke="var(--hair-color)" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M116,73 Q126,69 136,74" stroke="var(--hair-color)" stroke-width="2" fill="none" stroke-linecap="round"/></g><path class="layer-nose" d="M98,104 Q100,110 102,104" stroke="var(--skin-shadow)" stroke-width="1.8" fill="none" stroke-linecap="round"/><path class="layer-mouth" d="M84,120 Q100,132 116,120" stroke="var(--lip-color)" stroke-width="2.5" fill="var(--lip-color)" fill-opacity="0.35" stroke-linecap="round"></path><g class="layer-mustache"></g><g class="layer-beard"></g><g class="layer-glasses"></g><g class="layer-hair-front">
      <path d="M48,75 Q48,32 100,28 Q152,32 152,75 Q140,56 100,52 Q60,56 48,75 Z"
            fill="var(--hair-color)"/></g><g class="layer-accessory">
      <!-- Graduation mortarboard cap -->
      <!-- Cap crown (skull cap — covers top of head generously) -->
      <path d="M46,56 Q44,38 62,30 Q80,22 100,22 Q120,22 138,30 Q156,38 154,56
              Q134,62 100,62 Q66,62 46,56 Z" fill="#1E293B" stroke="#0F172A" stroke-width="0.6"/>
      <!-- Flat board — large diamond shape for 3D perspective -->
      <polygon points="100,8 168,34 100,54 32,34" fill="#1E293B" stroke="#0F172A" stroke-width="0.8"/>
      <!-- Board top highlight for depth -->
      <polygon points="100,11 164,34 100,52 36,34" fill="#334155" opacity="0.3"/>
      <!-- Button on top center -->
      <circle cx="100" cy="32" r="3.5" fill="#475569" stroke="#0F172A" stroke-width="0.8"/>
      <!-- Tassel string from center button draping to right -->
      <path d="M100,32 Q124,24 144,32 Q158,44 160,62" fill="none" stroke="#EAB308" stroke-width="2.2" stroke-linecap="round"/>
      <!-- Tassel end fringe -->
      <line x1="158" y1="60" x2="156" y2="70" stroke="#EAB308" stroke-width="1.2"/>
      <line x1="160" y1="62" x2="159" y2="72" stroke="#EAB308" stroke-width="1.2"/>
      <line x1="162" y1="61" x2="162" y2="71" stroke="#EAB308" stroke-width="1.2"/>
      <line x1="159" y1="71" x2="159" y2="77" stroke="#CA8A04" stroke-width="1.5"/></g></g></svg>
