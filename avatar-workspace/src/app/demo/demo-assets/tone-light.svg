<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" style="--skin-base: #FDDBB4;--skin-ear: #F5C89A;--skin-shadow: #E0A473;--lip-color: #E8967A;--hair-color: #F0F0F0;--eye-color: #6B3A2A"><defs><clipPath id="hat-clip"><rect x="0" y="56" width="200" height="144"/></clipPath><clipPath id="helmet-clip"><ellipse cx="100" cy="78" rx="57" ry="62"/></clipPath></defs><g class="layer-body">
      <path d="M30,200 Q30,158 55,150 Q75,143 88,140
              L88,145 Q90,148 100,148 Q110,148 112,145 L112,140
              Q125,143 145,150 Q170,158 170,200 Z" fill="#6B7280"/>
      <!-- Collar line -->
      <path d="M88,145 Q90,150 100,151 Q110,150 112,145"
            fill="none" stroke="#5B6370" stroke-width="1.5" stroke-linecap="round"/></g><rect class="layer-neck" x="88" y="135" width="24" height="22" rx="8" fill="var(--skin-base)"/><g class="layer-head"><g class="layer-ears"><ellipse cx="48" cy="90" rx="8" ry="10" fill="var(--skin-ear)"/><ellipse cx="152" cy="90" rx="8" ry="10" fill="var(--skin-ear)"/></g><g class="layer-hair-back">
      <ellipse cx="100" cy="62" rx="54" ry="34" fill="var(--hair-color)"/></g><ellipse class="layer-face" cx="100" cy="88" rx="52" ry="56" fill="var(--skin-base)"/><g class="layer-eyes"><g>
      <circle cx="74" cy="88" r="11" fill="#FFF"/>
      <circle cx="126" cy="88" r="11" fill="#FFF"/></g><g class="pupils"><g>
      <circle cx="74" cy="88" r="9" fill="var(--eye-color)"/>
      <circle cx="74" cy="88" r="5" fill="#1A1A2E"/>
      <circle cx="77" cy="85" r="2" fill="#FFF"/>
      <circle cx="126" cy="88" r="9" fill="var(--eye-color)"/>
      <circle cx="126" cy="88" r="5" fill="#1A1A2E"/>
      <circle cx="129" cy="85" r="2" fill="#FFF"/></g></g></g><g class="layer-eyelids"><rect class="eyelid-left" x="63" y="77" width="22" height="22" rx="11" fill="var(--skin-base)"/><rect class="eyelid-right" x="115" y="77" width="22" height="22" rx="11" fill="var(--skin-base)"/></g><g class="layer-brows"><rect x="63" y="72" width="22" height="5" rx="3" fill="var(--hair-color)"/><rect x="115" y="72" width="22" height="5" rx="3" fill="var(--hair-color)"/></g><path class="layer-nose" d="M97,105 Q100,112 103,105" stroke="var(--skin-shadow)" stroke-width="2" fill="none" stroke-linecap="round"/><path class="layer-mouth" d="M84,120 Q100,132 116,120" stroke="var(--lip-color)" stroke-width="2.5" fill="none" stroke-linecap="round"/><g class="layer-mustache"></g><g class="layer-beard">
    <!-- 5 o'clock shadow following jawline -->
    <path d="M72,114 Q68,128 76,140 Q88,150 100,152 Q112,150 124,140 Q132,128 128,114
             Q122,128 100,134 Q78,128 72,114 Z"
          fill="var(--hair-color)" opacity="0.2"/></g><g class="layer-glasses"></g><g class="layer-hair-front">
      <path d="M48,75 Q48,32 100,28 Q152,32 152,75 Q140,58 100,54 Q60,58 48,75 Z"
            fill="var(--hair-color)"/></g><g class="layer-accessory"></g></g></svg>
