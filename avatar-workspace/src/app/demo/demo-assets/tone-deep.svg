      <circle cx="129" cy="85" r="2" fill="#FFF"/></g></g></g><g class="layer-brows"><rect x="63" y="72" width="22" height="5" rx="3" fill="var(--hair-color)"/><rect x="115" y="72" width="22" height="5" rx="3" fill="var(--hair-color)"/></g><path class="layer-nose" d="M97,105 Q100,112 103,105" stroke="var(--skin-shadow)" stroke-width="2" fill="none" stroke-linecap="round"/><path class="layer-mouth" d="M84,120 Q100,132 116,120" stroke="var(--lip-color)" stroke-width="2.5" fill="none" stroke-linecap="round"><animate attributeName="d" calcMode="discrete" dur="0.560s" repeatCount="indefinite" values="M82,122 Q100,128 118,122;M86,122 Q100,124 114,122;M84,120 Q100,132 116,120;M82,122 Q100,128 118,122;M84,118 Q100,136 116,118;M82,122 Q100,128 118,122;M84,120 Q100,132 116,120"/></path><g class="layer-mustache"></g><g class="layer-beard"></g><g class="layer-glasses"></g><g class="layer-hair-front">
