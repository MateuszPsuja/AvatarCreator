<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" style="--skin-base: #FDDBB4;--skin-ear: #F5C89A;--skin-shadow: #E0A473;--lip-color: #E8967A;--hair-color: #1A1A2E;--eye-color: #6B3A2A"><defs><clipPath id="hat-clip"><rect x="0" y="56" width="200" height="144"/></clipPath><clipPath id="helmet-clip"><ellipse cx="100" cy="78" rx="57" ry="62"/></clipPath></defs><g class="layer-body">
      <!-- Blue scrub underneath -->
      <path d="M30,200 Q30,158 55,150 Q75,143 88,140
              L88,145 Q90,148 100,148 Q110,148 112,145 L112,140
              Q125,143 145,150 Q170,158 170,200 Z" fill="#3B82F6"/>
      <!-- V-neck scrub neckline -->
      <path d="M88,140 L96,155 L100,152 L104,155 L112,140"
            fill="#3B82F6" stroke="#2563EB" stroke-width="1"/>
      <!-- White lab coat — open front, over shoulders -->
      <path d="M30,200 Q30,158 55,150 Q70,145 80,142
              L82,155 L90,200 Z" fill="#F8FAFC"/>
      <path d="M170,200 Q170,158 145,150 Q130,145 120,142
              L118,155 L110,200 Z" fill="#F8FAFC"/>
      <!-- Coat lapels -->
      <path d="M80,142 L86,158 L82,155" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="0.5"/>
      <path d="M120,142 L114,158 L118,155" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="0.5"/>
      <!-- Breast pocket -->
      <rect x="34" y="168" width="14" height="10" rx="1" fill="none" stroke="#CBD5E1" stroke-width="1"/>
      <!-- Stethoscope — tubes start behind neck, just under jaw (~y=142) -->
      <path d="M95,142 Q80,148 76,156 Q74,166 84,172 Q94,177 100,175"
            fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M105,142 Q120,148 124,156 Q126,166 116,172 Q106,177 100,175"
            fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Stethoscope chest piece (centered on chest) -->
      <circle cx="100" cy="177" r="5" fill="#64748B" stroke="#475569" stroke-width="1.2"/>
      <circle cx="100" cy="177" r="2" fill="#94A3B8"/></g><rect class="layer-neck" x="90" y="135" width="20" height="22" rx="8" fill="var(--skin-base)"/><g class="layer-head"><g class="layer-ears"><ellipse cx="48" cy="90" rx="7" ry="9" fill="var(--skin-ear)"/><ellipse cx="152" cy="90" rx="7" ry="9" fill="var(--skin-ear)"/></g><g class="layer-hair-back">
      <circle cx="100" cy="24" r="18" fill="var(--hair-color)"/>
      <ellipse cx="100" cy="60" rx="54" ry="32" fill="var(--hair-color)"/></g><ellipse class="layer-face" cx="100" cy="86" rx="49" ry="55" fill="var(--skin-base)"/><g class="layer-eyes"><g>
      <circle cx="74" cy="88" r="11" fill="#FFF"/>
      <circle cx="126" cy="88" r="11" fill="#FFF"/></g><g class="pupils"><g>
      <circle cx="74" cy="88" r="9" fill="var(--eye-color)"/>
      <circle cx="74" cy="88" r="5" fill="#1A1A2E"/>
      <circle cx="77" cy="85" r="2" fill="#FFF"/>
      <circle cx="126" cy="88" r="9" fill="var(--eye-color)"/>
      <circle cx="126" cy="88" r="5" fill="#1A1A2E"/>
      <circle cx="129" cy="85" r="2" fill="#FFF"/></g></g></g><g class="layer-lashes"><path d="M65,78 L62,74" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M70,76 L68,72" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M76,76 L78,72" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M82,78 L85,74" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M117,78 L114,74" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M122,76 L120,72" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M128,76 L130,72" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M134,78 L137,74" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/></g><g class="layer-eyelids"><rect class="eyelid-left" x="63" y="77" width="22" height="22" rx="11" fill="var(--skin-base)"/><rect class="eyelid-right" x="115" y="77" width="22" height="22" rx="11" fill="var(--skin-base)"/></g><g class="layer-brows"><path d="M64,74 Q74,69 84,73" stroke="var(--hair-color)" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M116,73 Q126,69 136,74" stroke="var(--hair-color)" stroke-width="2" fill="none" stroke-linecap="round"/></g><path class="layer-nose" d="M98,104 Q100,110 102,104" stroke="var(--skin-shadow)" stroke-width="1.8" fill="none" stroke-linecap="round"/><path class="layer-mouth" d="M84,120 Q100,132 116,120" stroke="var(--lip-color)" stroke-width="2.5" fill="var(--lip-color)" fill-opacity="0.35" stroke-linecap="round"/><g class="layer-mustache"></g><g class="layer-beard"></g><g class="layer-glasses"></g><g class="layer-hair-front">
      <path d="M48,75 Q48,32 100,28 Q152,32 152,75 Q140,56 100,52 Q60,56 48,75 Z"
            fill="var(--hair-color)"/></g><g class="layer-accessory"></g></g></svg>
