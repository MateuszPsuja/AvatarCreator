<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" style="--skin-base: #F0AC78;--skin-ear: #E09A62;--skin-shadow: #C67C45;--lip-color: #C97050;--hair-color: #1A1A2E;--eye-color: #6B3A2A"><defs><clipPath id="hat-clip"><rect x="0" y="56" width="200" height="144"/></clipPath><clipPath id="helmet-clip"><ellipse cx="100" cy="78" rx="57" ry="62"/></clipPath></defs><g class="layer-body">
      <!-- White chef jacket -->
      <path d="M30,200 Q30,158 55,150 Q75,143 88,140
              L88,145 Q90,148 100,148 Q110,148 112,145 L112,140
              Q125,143 145,150 Q170,158 170,200 Z" fill="#FEFEFE"/>
      <!-- Mandarin collar -->
      <rect x="86" y="138" width="28" height="8" rx="3" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <!-- Double-breasted buttons (left row) -->
      <circle cx="88" cy="162" r="2" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="0.8"/>
      <circle cx="88" cy="174" r="2" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="0.8"/>
      <circle cx="88" cy="186" r="2" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="0.8"/>
      <!-- Right row -->
      <circle cx="96" cy="162" r="2" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="0.8"/>
      <circle cx="96" cy="174" r="2" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="0.8"/>
      <circle cx="96" cy="186" r="2" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="0.8"/>
      <!-- Center front seam -->
      <line x1="100" y1="146" x2="100" y2="200" stroke="#E2E8F0" stroke-width="0.8"/></g><rect class="layer-neck" x="88" y="135" width="24" height="22" rx="8" fill="var(--skin-base)"/><g class="layer-head"><g class="layer-ears"><ellipse cx="48" cy="90" rx="8" ry="10" fill="var(--skin-ear)"/><ellipse cx="152" cy="90" rx="8" ry="10" fill="var(--skin-ear)"/></g><g class="layer-hair-back" clip-path="url(#hat-clip)">
      <path d="M42,80 Q38,30 100,22 Q162,30 158,80 L160,135 Q155,145 148,140
              Q142,148 132,142 Q122,150 112,142 Q102,148 92,142 Q82,150 72,142
              Q62,148 52,140 Q45,145 40,135 Z"
            fill="var(--hair-color)"/></g><ellipse class="layer-face" cx="100" cy="88" rx="52" ry="56" fill="var(--skin-base)"/><g class="layer-eyes"><g>
      <circle cx="74" cy="88" r="11" fill="#FFF"/>
      <circle cx="126" cy="88" r="11" fill="#FFF"/></g><g class="pupils"><g>
      <circle cx="74" cy="88" r="9" fill="var(--eye-color)"/>
      <circle cx="74" cy="88" r="5" fill="#1A1A2E"/>
      <circle cx="77" cy="85" r="2" fill="#FFF"/>
      <circle cx="126" cy="88" r="9" fill="var(--eye-color)"/>
      <circle cx="126" cy="88" r="5" fill="#1A1A2E"/>
      <circle cx="129" cy="85" r="2" fill="#FFF"/></g></g></g><g class="layer-brows"><rect x="63" y="72" width="22" height="5" rx="3" fill="var(--hair-color)"/><rect x="115" y="72" width="22" height="5" rx="3" fill="var(--hair-color)"/></g><path class="layer-nose" d="M97,105 Q100,112 103,105" stroke="var(--skin-shadow)" stroke-width="2" fill="none" stroke-linecap="round"/><path class="layer-mouth" d="M84,120 Q100,132 116,120" stroke="var(--lip-color)" stroke-width="2.5" fill="none" stroke-linecap="round"></path><g class="layer-mustache"><path d="M77.83,108.51 Q87.8,114 93.9,114.63 Q100,115.25 106.1,114.63 Q112.2,114 117.19,111.26 Q122.17,108.51 117.19,110.13 Q112.2,111.75 106.1,112.5 Q100,113.25 93.9,112.5 Q87.8,111.75 82.81,110.13 Q77.83,108.51 82.81,111.26 Z" fill="#1A1A2E"/></g><g class="layer-beard"><path d="M74.64,120.48 Q76.2,122.12 77.02,122.94 Q77.84,123.76 78.71,124.58 Q79.58,125.4 80.51,126.22 Q81.43,127.04 82.42,127.86 Q83.41,128.68 84.46,129.5 Q85.52,130.32 86.65,131.14 Q87.79,131.96 89.02,132.78 Q90.24,133.6 91.59,134.42 Q92.93,135.24 94.42,136.06 Q95.91,136.88 97.6,137.7 Q99.28,138.52 99.64,139.34 Q100,140.16 100,140.98 Q100,141.8 100,142.62 Q100,143.44 100,143.44 Q100,143.44 100,142.62 Q100,141.8 100,140.98 Q100,140.16 100.36,139.34 Q100.72,138.52 102.4,137.7 Q104.09,136.88 105.58,136.06 Q107.07,135.24 108.41,134.42 Q109.76,133.6 110.98,132.78 Q112.21,131.96 113.35,131.14 Q114.48,130.32 115.54,129.5 Q116.59,128.68 117.58,127.86 Q118.57,127.04 119.49,126.22 Q120.42,125.4 121.29,124.58 Q122.16,123.76 122.98,122.94 Q123.8,122.12 124.58,121.3 Q125.36,120.48 127.86,120.48 Q130.36,120.48 129.78,121.32 Q129.2,122.16 128.58,123 Q127.96,123.84 127.28,124.68 Q126.6,125.52 125.87,126.36 Q125.14,127.2 124.34,128.04 Q123.54,128.88 122.67,129.72 Q121.8,130.56 120.84,131.4 Q119.88,132.24 118.82,133.08 Q117.76,133.92 116.58,134.76 Q115.39,135.6 114.05,136.44 Q112.7,137.28 111.13,138.12 Q109.56,138.96 107.65,139.8 Q105.74,140.64 103.19,141.48 Q100.64,142.32 100.32,143.16 Q100,144 100,144 Q100,144 99.68,143.16 Q99.36,142.32 96.81,141.48 Q94.26,140.64 92.35,139.8 Q90.44,138.96 88.87,138.12 Q87.3,137.28 85.95,136.44 Q84.61,135.6 83.42,134.76 Q82.24,133.92 81.18,133.08 Q80.12,132.24 79.16,131.4 Q78.2,130.56 77.33,129.72 Q76.46,128.88 75.66,128.04 Q74.86,127.2 74.13,126.36 Q73.4,125.52 72.72,124.68 Q72.04,123.84 71.42,123 Q70.8,122.16 70.22,121.32 Q69.64,120.48 72.14,120.48 Q74.64,120.48 75.42,121.3 Z" fill="#1A1A2E"/></g><g class="layer-glasses"></g><g class="layer-hair-front" clip-path="url(#hat-clip)">
      <path d="M44,82 Q42,30 100,22 Q158,30 156,82
              Q148,60 130,50 Q100,42 70,50 Q52,60 44,82 Z"
            fill="var(--hair-color)"/>
      <circle cx="44" cy="88" r="8" fill="var(--hair-color)"/>
      <circle cx="156" cy="88" r="8" fill="var(--hair-color)"/>
      <circle cx="48" cy="100" r="7" fill="var(--hair-color)"/>
      <circle cx="152" cy="100" r="7" fill="var(--hair-color)"/></g><g class="layer-accessory">
      <!-- Chef toque blanche — puffy hat, sized to sit inside the 0–200 canvas.
           The previous version ran to y=-48, so most of it was off-canvas and
           read as a shapeless blob. The face top is y=32, so the hat occupies
           y≈2…59: high enough to look tall, never past the top edge. -->
      <!-- Band at the forehead — spans the head width -->
      <rect x="48" y="44" width="104" height="15" rx="4" fill="#FEFEFE" stroke="#E2E8F0" stroke-width="1.2"/>
      <!-- Puffy toque body -->
      <path d="M56,46 C52,38 50,28 52,20
               C54,11 62,6 72,5
               C80,4 88,4 100,4
               C112,4 120,4 128,5
               C138,6 146,11 148,20
               C150,28 148,38 144,46 Z"
            fill="#FEFEFE" stroke="#E2E8F0" stroke-width="1"/>
      <!-- Crown puffs — overlapping rounded bumps, all within the canvas -->
      <ellipse cx="76" cy="18" rx="20" ry="12" fill="#FEFEFE"/>
      <ellipse cx="124" cy="18" rx="20" ry="12" fill="#FEFEFE"/>
      <ellipse cx="100" cy="14" rx="24" ry="13" fill="#FEFEFE"/>
      <!-- Pleat lines -->
      <path d="M76,44 Q70,26 76,8" stroke="#F0F0F0" stroke-width="0.7" fill="none"/>
      <path d="M100,44 L100,4" stroke="#F0F0F0" stroke-width="0.7" fill="none"/>
      <path d="M124,44 Q130,26 124,8" stroke="#F0F0F0" stroke-width="0.7" fill="none"/></g></g></svg>
