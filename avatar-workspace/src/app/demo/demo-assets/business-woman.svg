      <path d="M124,143 L114,158 L118,152" fill="#27272A" stroke="#333" stroke-width="0.5"/>
      <!-- Suit button -->
      <circle cx="88" cy="175" r="2" fill="#3F3F46"/>
      <circle cx="112" cy="175" r="2" fill="#3F3F46"/>
      <!-- Necktie -->
      <path d="M96,148 L100,150 L104,148 L100,146 Z" fill="#DC2626"/>
      <path d="M97,150 L100,152 L103,150 L103.5,150" fill="#DC2626"/>
      <polygon points="100,152 95,200 105,200" fill="#DC2626"/>
      <!-- Tie knot -->
      <path d="M97,148 L100,151 L103,148" fill="#B91C1C"/>
      <!-- Tie stripe detail -->
      <line x1="97" y1="165" x2="103" y2="162" stroke="#991B1B" stroke-width="1"/>
      <line x1="97" y1="175" x2="103" y2="172" stroke="#991B1B" stroke-width="1"/>
      <line x1="97" y1="185" x2="103" y2="182" stroke="#991B1B" stroke-width="1"/></g><rect class="layer-neck" x="90" y="135" width="20" height="22" rx="8" fill="var(--skin-base)"/><g class="layer-head"><g class="layer-ears"><ellipse cx="48" cy="90" rx="7" ry="9" fill="var(--skin-ear)"/><ellipse cx="152" cy="90" rx="7" ry="9" fill="var(--skin-ear)"/></g><g class="layer-hair-back">
      <path d="M42,80 Q38,30 100,22 Q162,30 158,80 L160,135 Q155,145 148,140
              Q142,148 132,142 Q122,150 112,142 Q102,148 92,142 Q82,150 72,142
              Q62,148 52,140 Q45,145 40,135 Z"
            fill="var(--hair-color)"/></g><ellipse class="layer-face" cx="100" cy="86" rx="49" ry="55" fill="var(--skin-base)"/><g class="layer-eyes"><g>
      <circle cx="74" cy="88" r="11" fill="#FFF"/>
      <circle cx="126" cy="88" r="11" fill="#FFF"/></g><g class="pupils"><g>
      <circle cx="74" cy="88" r="9" fill="var(--eye-color)"/>
      <circle cx="74" cy="88" r="5" fill="#1A1A2E"/>
      <circle cx="77" cy="85" r="2" fill="#FFF"/>
      <circle cx="126" cy="88" r="9" fill="var(--eye-color)"/>
      <circle cx="126" cy="88" r="5" fill="#1A1A2E"/>
      <circle cx="129" cy="85" r="2" fill="#FFF"/></g></g></g><g class="layer-lashes"><path d="M65,78 L62,74" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M70,76 L68,72" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M76,76 L78,72" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M82,78 L85,74" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M117,78 L114,74" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M122,76 L120,72" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M128,76 L130,72" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M134,78 L137,74" stroke="var(--hair-color)" stroke-width="1.5" stroke-linecap="round" fill="none"/></g><g class="layer-brows"><path d="M64,74 Q74,69 84,73" stroke="var(--hair-color)" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M116,73 Q126,69 136,74" stroke="var(--hair-color)" stroke-width="2" fill="none" stroke-linecap="round"/></g><path class="layer-nose" d="M98,104 Q100,110 102,104" stroke="var(--skin-shadow)" stroke-width="1.8" fill="none" stroke-linecap="round"/><path class="layer-mouth" d="M84,120 Q100,132 116,120" stroke="var(--lip-color)" stroke-width="2.5" fill="var(--lip-color)" fill-opacity="0.35" stroke-linecap="round"><animate attributeName="d" calcMode="discrete" dur="0.480s" repeatCount="indefinite" values="M86,122 Q100,124 114,122;M90,118 Q100,130 110,118;M82,122 Q100,128 118,122;M84,118 Q100,136 116,118;M82,122 Q100,128 118,122;M84,120 Q100,132 116,120"/></path><g class="layer-mustache"></g><g class="layer-beard"></g><g class="layer-glasses">
    <rect x="58" y="78" width="32" height="20" rx="4" fill="none"
          stroke="#1A1A2E" stroke-width="2"/>
    <rect x="110" y="78" width="32" height="20" rx="4" fill="none"
          stroke="#1A1A2E" stroke-width="2"/>
    <line x1="90" y1="88" x2="110" y2="88" stroke="#1A1A2E" stroke-width="2"/>
    <line x1="58" y1="86" x2="48" y2="84" stroke="#1A1A2E" stroke-width="1.5"/>
    <line x1="142" y1="86" x2="152" y2="84" stroke="#1A1A2E" stroke-width="1.5"/></g><g class="layer-hair-front">
      <path d="M44,82 Q42,30 100,22 Q158,30 156,82
